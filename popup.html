<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a1a1a;
    }
    h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
    label { display: block; margin-bottom: 4px; color: #555; }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 7px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1558b0; }
    select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .key-group { margin-bottom: 12px; }
    .status-msg { margin-top: 6px; color: #34a853; font-size: 12px; min-height: 14px; }
    .debug-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    .debug-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      color: #555;
    }
    .debug-row input[type="checkbox"] { width: auto; }
    .debug-row label { margin: 0; color: inherit; }
    .debug-hint { color: #999; font-size: 11px; line-height: 1.4; }
  </style>
</head>
<body>
  <h2>ReadFlow</h2>
  <label for="provider">使用的模型</label>
  <select id="provider">
    <option value="gemini">Gemini</option>
    <option value="deepseek">DeepSeek</option>
  </select>

  <div class="key-group">
    <label for="apiKey-gemini">Gemini API Key</label>
    <input type="password" id="apiKey-gemini" placeholder="AIza..." />
    <button id="save-gemini">Save</button>
    <div id="status-gemini" class="status-msg"></div>
  </div>

  <div class="key-group">
    <label for="apiKey-deepseek">DeepSeek API Key</label>
    <input type="password" id="apiKey-deepseek" placeholder="sk-..." />
    <button id="save-deepseek">Save</button>
    <div id="status-deepseek" class="status-msg"></div>
  </div>

  <div class="debug-section">
    <div class="debug-row">
      <input type="checkbox" id="debugMode">
      <label for="debugMode">Debug 模式（不呼叫 Gemini）</label>
    </div>
    <div class="debug-row">
      <input type="checkbox" id="debugModeError">
      <label for="debugModeError">Debug 模式模擬錯誤</label>
    </div>
    <p class="debug-hint">開啟後重新整理 Play Books 分頁即可生效；抽屜書籤會顯示「(Debug)」。</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
